<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUTURU — عالم الأنمي</title>
<style>
:root{color-scheme:dark;--bg:#090810;--surface:#14111f;--surface2:#1b1729;--text:#f8f5ff;--muted:#a7a0b8;--purple:#a78bfa;--purple2:#7c3aed;--line:#30283f;--pink:#f0abfc}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.6}button,input{font:inherit}button{cursor:pointer}.root{min-height:100vh;background:radial-gradient(ellipse at 78% 0%,#24153d 0,transparent 35%),var(--bg)}.wrap{width:min(1180px,92%);margin:auto}.topline{height:3px;background:linear-gradient(90deg,#7c3aed,#f0abfc,#60a5fa)}header{position:sticky;top:0;z-index:10;background:rgba(9,8,16,.88);backdrop-filter:blur(18px);border-bottom:1px solid #ffffff12}.nav{display:flex;align-items:center;gap:24px;min-height:76px}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-size:24px;font-weight:900;letter-spacing:1.5px;white-space:nowrap}.brand-mark{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#a78bfa,#7c3aed);box-shadow:0 0 28px #8b5cf655;font-size:21px}.navlinks{display:flex;gap:20px;align-items:center}.navlinks a{color:var(--muted);text-decoration:none;font-size:14px}.navlinks a.active,.navlinks a:hover{color:white}.search{margin-inline-start:auto;display:flex;align-items:center;gap:9px;max-width:290px;width:100%;background:#171321;border:1px solid var(--line);padding:10px 13px;border-radius:13px}.search input{min-width:0;width:100%;border:0;outline:0;background:transparent;color:white}.hero{padding:38px 0 28px}.hero-card{min-height:410px;position:relative;overflow:hidden;border:1px solid #ffffff18;border-radius:26px;background:linear-gradient(90deg,#0c0915 0%,rgba(12,9,21,.92) 38%,rgba(12,9,21,.16) 100%),radial-gradient(circle at 75% 30%,#a855f755,transparent 24%),linear-gradient(135deg,#17122a,#302044 55%,#11101d);display:flex;align-items:center;padding:clamp(24px,5vw,58px)}.hero-card:before{content:'T';position:absolute;right:10%;top:-130px;font-size:520px;line-height:1;font-weight:900;color:#c4b5fd0c;transform:rotate(8deg);pointer-events:none}.orbit{position:absolute;right:10%;top:12%;width:300px;height:300px;border:1px solid #c4b5fd30;border-radius:50%;box-shadow:0 0 80px #a855f71a,inset 0 0 70px #a855f711}.orbit:before,.orbit:after{content:'';position:absolute;border:1px solid #c4b5fd26;border-radius:50%;inset:25px}.orbit:after{inset:58px}.hero-content{position:relative;z-index:1;max-width:570px}.eyebrow{display:inline-flex;gap:8px;align-items:center;color:#e9d5ff;background:#8b5cf625;border:1px solid #a78bfa45;padding:6px 12px;border-radius:99px;font-size:12px}.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.2;margin:18px 0 12px;letter-spacing:-1px}.hero h1 span{color:var(--purple)}.hero p{max-width:460px;color:#c0b8d0;margin:0 0 22px}.section{padding:22px 0 28px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.section-title{margin:0;font-size:23px;display:flex;align-items:center;gap:10px}.section-title .bar{height:25px;width:4px;border-radius:4px;background:var(--purple)}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:17px}

/* بطاقات الأنمي */
.anime-card{min-width:0;position:relative;cursor:pointer;transition:transform .2s ease;-webkit-tap-highlight-color:transparent}
.anime-card:active{transform:scale(0.96)}

.poster{position:relative;overflow:hidden;aspect-ratio:3/4;border-radius:16px;border:1px solid #ffffff15;background:linear-gradient(155deg,var(--c1),var(--c2));display:flex;align-items:flex-end;padding:13px;isolation:isolate}
.poster:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 26%,#ffffff35,transparent 18%),linear-gradient(180deg,transparent 25%,#080710dd 100%);z-index:-1}
.poster:after{content:attr(data-symbol);position:absolute;top:14%;left:50%;transform:translateX(-50%);font-size:clamp(60px,8vw,100px);font-weight:900;color:#ffffff36;text-shadow:0 0 35px #ffffff30}

.poster .poster-tag{position:absolute;top:10px;right:10px;background:#090810b8;border:1px solid #ffffff2a;border-radius:7px;padding:3px 7px;font-size:10px}
.poster .poster-name{font-size:19px;font-weight:900;text-shadow:0 2px 14px #000;position:relative}
.poster .poster-sub{font-size:11px;color:#ded6ed;position:relative}
.card-info{padding:10px 2px 0}
.card-title{font-weight:700;margin:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-sub{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:5px;margin-top:4px}

/* صفحات التفاصيل ومشغل الفيديو */
.view-section{display:none}.view-section.active{display:block}
.details-container{padding:25px 0}
.back-btn{background:var(--surface);border:1px solid var(--line);color:white;padding:10px 20px;border-radius:12px;margin-bottom:20px;display:inline-flex;align-items:center;gap:8px;font-weight:bold;cursor:pointer}
.details-box{background:var(--surface);border:1px solid var(--line);padding:30px;border-radius:20px}
.details-header{display:flex;gap:25px;align-items:flex-start;margin-bottom:25px}
.details-poster-lg{width:220px;aspect-ratio:3/4;border-radius:14px;display:grid;place-items:center;font-size:50px;font-weight:bold;background:linear-gradient(155deg,#8b432e,#243d69);flex-shrink:0}
.details-info h1{margin:0 0 10px;font-size:28px}
.info-section-title{color:var(--purple);font-size:18px;margin:20px 0 10px;border-bottom:1px solid var(--line);padding-bottom:5px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:15px}
.info-box{background:var(--surface2);border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:13px;color:var(--muted)}
.info-box span{color:white;font-weight:bold;display:block;margin-top:3px}
.desc-box{background:var(--surface2);border:1px solid var(--line);padding:15px;border-radius:10px;color:#ded6ed;font-size:14px;line-height:1.7}
.seasons-bar{display:flex;gap:10px;margin:15px 0;flex-wrap:wrap}
.season-tab{background:var(--surface2);border:1px solid var(--line);color:var(--text);padding:9px 18px;border-radius:10px;cursor:pointer;font-weight:bold}
.season-tab.active{background:var(--purple2);border-color:var(--purple)}

/* مشغل الفيديو وقائمة الحلقات */
.player-wrapper{margin-top:25px;background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:15px;overflow:hidden}
.player-container{position:relative;width:100%;padding-top:56.25%;background:#000;border-radius:12px;overflow:hidden}
.player-container iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.episodes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin-top:15px}
.ep-btn{background:var(--bg);border:1px solid var(--line);color:white;padding:10px;border-radius:8px;font-size:13px;font-weight:bold;cursor:pointer;text-align:center}
.ep-btn:hover,.ep-btn.active{background:var(--purple2);border-color:var(--purple)}

@media(max-width:850px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.details-header{flex-direction:column}}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="root">
<div class="topline"></div>
<header><div class="wrap nav">
<a class="brand" href="#home" aria-label="TUTURU الرئيسية"><span class="brand-mark">と</span><span>TUTURU</span></a>
<nav class="navlinks" aria-label="القائمة الرئيسية"><a class="active" href="#home">الرئيسية</a><a href="#featured">أنميات مميزة</a></nav>
<label class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="ابحث عن أنمي..." aria-label="ابحث عن أنمي"></label>
</div></header>

<!-- الواجهة الرئيسية -->
<main id="homeView" class="view-section active wrap">
<section class="hero"><div class="hero-card"><div class="orbit"></div><div class="hero-content"><div class="eyebrow">✦ بوابتك إلى عوالم الأ
